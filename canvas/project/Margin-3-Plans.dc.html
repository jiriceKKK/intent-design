<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Margin · Plans</title>
<script src="./support.js"></script>
<link rel="stylesheet" href="margin.css">
</head>
<body>
<x-dc>
<helmet>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Newsreader:ital,opsz,wght@0,6..72,300..700;1,6..72,300..700&amp;family=IBM+Plex+Mono:wght@400;500&amp;display=swap">
<style>body{margin:0}</style>
</helmet>
<div class="c-margin">
  <div style="position: absolute; left: 20px; right: 20px; top: 60px; display: flex; flex-direction: column; gap: 10px;">
    <div style="display: flex; align-items: center; justify-content: space-between; height: 15px;">
      <p class="mg-kicker">2 tasks · 1 routine</p>
    </div>
    <div style="display: flex; align-items: flex-end; justify-content: space-between;">
      <h1 class="mg-mast" style="font-size: 56px; line-height: 56px;">Plans</h1>
      <button type="button" class="mg-link" style="margin-bottom: 2px;">
        <svg width="14" height="14" viewBox="0 0 14 14" fill="none" aria-hidden="true"><path d="M7 1.5 V 12.5 M 1.5 7 H 12.5" stroke="#1B1D23" stroke-width="1.3" stroke-linecap="round"></path></svg>
        New task
      </button>
    </div>
  </div>

  <p class="mg-kicker" style="position: absolute; left: 20px; top: 160px;">Tasks</p>
  <hr class="mg-rule" style="position: absolute; left: 20px; right: 20px; top: 182px; margin: 0; background: #1B1D23;">

  <article class="mg-row" style="position: absolute; left: 20px; right: 20px; top: 198px;">
    <p class="mg-time" style="padding-top: 4px;">01</p>
    <div style="display: flex; flex-direction: column; gap: 4px;">
      <h2 style="font-size: 22px; line-height: 28px; font-weight: 520;">Essay outline</h2>
      <span class="mg-note" style="margin-top: -2px;">next step ready</span>
      <p style="font-size: 19px; line-height: 25px; color: #1B1D23;"><span class="mg-mark">Open the document and write three bullet points.</span></p>
      <div style="display: flex; align-items: center; gap: 18px; margin-top: 8px;">
        <button type="button" class="mg-btn mg-btn-ink" style="height: 44px; padding: 0 18px; font-size: 17px;">Resume</button>
        <span class="mg-note" style="flex: 1;">16:30 today</span>
        <button type="button" class="mg-link" style="font-size: 16px;">Edit</button>
      </div>
    </div>
  </article>

  <hr class="mg-rule" style="position: absolute; left: 20px; right: 20px; top: 380px; margin: 0;">

  <article class="mg-row" style="position: absolute; left: 20px; right: 20px; top: 396px;">
    <p class="mg-time" style="padding-top: 4px;">02</p>
    <div style="display: flex; flex-direction: column; gap: 4px;">
      <h2 style="font-size: 22px; line-height: 28px; font-weight: 520;">Portfolio update</h2>
      <span class="mg-note" style="margin-top: -2px;">not scheduled yet</span>
      <p class="mg-body" style="font-style: italic;">No first step written. It keeps here until you want it.</p>
      <div style="display: flex; align-items: center; justify-content: space-between; margin-top: 4px;">
        <button type="button" class="mg-link" style="font-size: 17px;">Plan a first step</button>
        <button type="button" class="mg-link" style="font-size: 16px;">Edit</button>
      </div>
    </div>
  </article>

  <p class="mg-kicker" style="position: absolute; left: 20px; top: 560px;">Routines</p>
  <hr class="mg-rule" style="position: absolute; left: 20px; right: 20px; top: 582px; margin: 0; background: #1B1D23;">

  <article class="mg-row" style="position: absolute; left: 20px; right: 20px; top: 598px;">
    <div style="padding-top: 5px;">
      <svg width="18" height="18" viewBox="0 0 18 18" fill="none" aria-hidden="true"><path d="M14.6 9 A 5.6 5.6 0 1 1 12.4 4.6" stroke="#1B1D23" stroke-width="1.4" stroke-linecap="round"></path><path d="M10.2 3.6 L 12.8 4.2 L 12.2 6.8" stroke="#1B1D23" stroke-width="1.4" stroke-linecap="round" stroke-linejoin="round"></path></svg>
    </div>
    <div style="display: flex; align-items: center; justify-content: space-between; gap: 8px;">
      <div style="display: flex; flex-direction: column; gap: 2px;">
        <h2 style="font-size: 22px; line-height: 28px; font-weight: 520;">Evening reading</h2>
        <span class="mg-note">Read one page<br>5 min · after dinner</span>
      </div>
      <button type="button" class="mg-link" style="font-size: 16px;">Edit</button>
    </div>
  </article>

  <hr class="mg-rule" style="position: absolute; left: 20px; right: 20px; top: 668px; margin: 0;">

  <div class="mg-row" style="position: absolute; left: 20px; right: 20px; top: 678px;">
    <span></span>
    <button type="button" class="mg-link" style="justify-self: start;">
      <svg width="14" height="14" viewBox="0 0 14 14" fill="none" aria-hidden="true"><path d="M7 1.5 V 12.5 M 1.5 7 H 12.5" stroke="#1B1D23" stroke-width="1.3" stroke-linecap="round"></path></svg>
      New routine
    </button>
  </div>

  <nav class="mg-nav" aria-label="Main">
    <button type="button" class="mg-tab">Today</button>
    <button type="button" class="mg-tab" aria-current="page">Plans</button>
    <button type="button" class="mg-tab">Progress</button>
  </nav>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":390,"height":844}}'>
class Component extends DCLogic {
  renderVals() { return {}; }
}
</script>
</body>
</html>
