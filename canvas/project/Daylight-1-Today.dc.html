<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Daylight · Today</title>

<link rel="stylesheet" href="daylight.css">
</head>
<body>
<x-dc>
<helmet>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Geist:wght@200..800&amp;display=swap">
<style>body{margin:0}</style>
</helmet>
<div class="c-daylight">
  <div style="position: absolute; left: 24px; right: 24px; top: 62px; display: flex; flex-direction: column; gap: 4px;">
    <p class="dl-date">Sunday 4 October</p>
    <h1 class="dl-title">Today</h1>
  </div>

  <svg width="390" height="290" viewBox="0 0 390 290" fill="none" style="position: absolute; left: 0; top: 14px;" role="img" aria-label="Your afternoon and evening: now is 15:48; Essay outline at 16:30; Evening reading after dinner">
    <defs>
      <linearGradient id="dl-rest" x1="100" y1="0" x2="366" y2="0" gradientUnits="userSpaceOnUse">
        <stop offset="0" stop-color="#F29A4A"></stop>
        <stop offset="0.55" stop-color="#C77FA8"></stop>
        <stop offset="1" stop-color="#5B5BA6"></stop>
      </linearGradient>
      <radialGradient id="dl-sunglow" cx="0.5" cy="0.5" r="0.5">
        <stop offset="0" stop-color="#FFC58F" stop-opacity="0.95"></stop>
        <stop offset="1" stop-color="#FFC58F" stop-opacity="0"></stop>
      </radialGradient>
    </defs>
    <path d="M14 250 H 376" stroke="rgba(29,36,51,0.16)" stroke-width="1"></path>
    <path d="M24 250 A 171 100 0 0 1 101.9 166.1" stroke="rgba(29,36,51,0.22)" stroke-width="2" stroke-linecap="round"></path>
    <path d="M101.9 166.1 A 171 100 0 0 1 366 250" stroke="url(#dl-rest)" stroke-width="3" stroke-linecap="round"></path>
    <path d="M239.3 153.4 A 171 100 0 0 1 299.1 170.7" stroke="rgba(91,91,166,0.28)" stroke-width="12" stroke-linecap="round"></path>
    <circle cx="101.9" cy="166.1" r="26" fill="url(#dl-sunglow)"></circle>
    <circle cx="101.9" cy="166.1" r="8" fill="#F29A4A" stroke="#FFFFFF" stroke-width="2.5"></circle>
    <text x="101.9" y="142" text-anchor="middle" class="dl-axis" style="font-weight: 600; fill: #9E5A1C;">now</text>
    <circle cx="129.6" cy="157.6" r="5.5" fill="#1D2433" stroke="#FFFFFF" stroke-width="2"></circle>
    <text x="134" y="186" text-anchor="middle" style="font-family: Geist, system-ui, sans-serif; font-size: 12.5px; font-weight: 650; fill: #1D2433;">16:30</text>
    <circle cx="270.6" cy="160.3" r="6" fill="#FFFFFF" stroke="#5B5BA6" stroke-width="2.25"></circle>
    <text x="270.6" y="189" text-anchor="middle" style="font-family: Geist, system-ui, sans-serif; font-size: 12.5px; font-weight: 650; fill: #1D2433;">After dinner</text>
    <text x="24" y="268" text-anchor="start" class="dl-axis">Noon</text>
    <text x="366" y="268" text-anchor="end" class="dl-axis">Midnight</text>
  </svg>

  <article class="dl-glass" style="position: absolute; left: 16px; right: 16px; top: 302px; padding: 16px 18px 18px; display: flex; flex-direction: column; gap: 8px;">
    <div style="display: flex; align-items: center; justify-content: space-between;">
      <span class="dl-chip">
        <svg width="10" height="10" viewBox="0 0 10 10" fill="none" aria-hidden="true"><circle cx="5" cy="5" r="4.2" fill="#1D2433"></circle></svg>
        16:30
      </span>
      <span class="dl-cap">25 min</span>
    </div>
    <p class="dl-label" style="margin-top: 4px;">Essay outline</p>
    <h2 class="dl-action">Open the document and write three bullet points.</h2>
    <button type="button" class="dl-btn dl-btn-ink" style="margin-top: 10px; width: 100%; height: 52px; border-radius: 26px;">
      <svg width="16" height="16" viewBox="0 0 18 18" fill="none" aria-hidden="true"><path d="M5.5 3.6 C 5.5 2.9, 6.3 2.5, 6.9 2.9 L 14.2 7.9 C 14.8 8.3, 14.8 9.2, 14.2 9.6 L 6.9 14.6 C 6.3 15, 5.5 14.6, 5.5 13.9 Z" fill="#FFFFFF"></path></svg>
      Start
    </button>
  </article>

  <article class="dl-glass" style="position: absolute; left: 16px; right: 16px; top: 544px; padding: 14px 14px 14px 18px; display: flex; align-items: center; gap: 12px; border-radius: 26px;">
    <span style="flex: 1; display: flex; flex-direction: column; gap: 4px;">
      <span style="display: flex; align-items: center; gap: 8px;">
        <span class="dl-chip" style="height: 26px;">
          <svg width="11" height="11" viewBox="0 0 11 11" fill="none" aria-hidden="true"><circle cx="5.5" cy="5.5" r="4.2" stroke="#5B5BA6" stroke-width="1.8"></circle></svg>
          After dinner
        </span>
        <span class="dl-cap">Routine · 5 min</span>
      </span>
      <span class="dl-label" style="margin-top: 4px;">Evening reading</span>
      <span class="dl-action-sm">Read one page.</span>
    </span>
    <button type="button" class="dl-btn dl-btn-glass" style="height: 46px; padding: 0 18px; font-size: 15px;">Start</button>
  </article>

  <nav class="dl-tabbar" aria-label="Main">
    <button type="button" class="dl-tab" aria-current="page">
      <svg width="24" height="22" viewBox="0 0 24 22" fill="none" aria-hidden="true"><path d="M2 17 A 10 8 0 0 1 22 17" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"></path><path d="M1 17 H 23" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"></path><circle cx="8" cy="11.2" r="2.6" fill="#F29A4A"></circle></svg>
      Today
    </button>
    <button type="button" class="dl-tab">
      <svg width="22" height="22" viewBox="0 0 22 22" fill="none" aria-hidden="true"><rect x="2.5" y="3" width="17" height="6" rx="3" stroke="currentColor" stroke-width="1.7"></rect><rect x="2.5" y="12.5" width="17" height="6" rx="3" stroke="currentColor" stroke-width="1.7"></rect></svg>
      Plans
    </button>
    <button type="button" class="dl-tab">
      <svg width="22" height="22" viewBox="0 0 22 22" fill="none" aria-hidden="true"><path d="M3 18 V 13 M 8 18 V 9 M 13 18 V 11 M 18 18 V 5" stroke="currentColor" stroke-width="2" stroke-linecap="round"></path></svg>
      Progress
    </button>
  </nav>
  <button type="button" class="dl-fab" aria-label="Add a task">
    <svg width="20" height="20" viewBox="0 0 20 20" fill="none" aria-hidden="true"><path d="M10 3.5 V 16.5 M 3.5 10 H 16.5" stroke="#1D2433" stroke-width="2" stroke-linecap="round"></path></svg>
  </button>
</div>
</x-dc>

</html>
