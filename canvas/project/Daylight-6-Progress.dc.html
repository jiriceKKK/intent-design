<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Daylight · Progress</title>

</head>
<body>
<x-dc>
<helmet>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Geist:wght@200..800&amp;display=swap">
<style>body{margin:0}</style>
</helmet>
<div class="c-daylight">
  <div style="position: absolute; left: 24px; right: 16px; top: 62px; display: flex; align-items: flex-end; justify-content: space-between;">
    <div style="display: flex; flex-direction: column; gap: 4px;">
      <p class="dl-date">Last 7 days</p>
      <h1 class="dl-title">Progress</h1>
    </div>
    <span class="dl-chip" style="margin-bottom: 6px; font-weight: 550; color: #3B4457;">Sample data</span>
  </div>

  <h2 class="dl-big" style="position: absolute; left: 24px; top: 140px; font-size: 32px; line-height: 38px;">2 tasks finished</h2>
  <div style="position: absolute; left: 16px; right: 16px; top: 190px; display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 10px;">
    <div class="dl-glass" style="height: 104px; border-radius: 26px; padding: 14px 16px; display: flex; flex-direction: column; justify-content: space-between; background: radial-gradient(90% 90% at 100% 0%, rgba(255, 200, 150, 0.55) 0%, rgba(255, 255, 255, 0.56) 60%);">
      <svg width="26" height="26" viewBox="0 0 24 24" fill="none" aria-hidden="true"><circle cx="12" cy="12" r="12" fill="#1D2433"></circle><path d="M7.4 12.2 L 10.6 15.2 L 16.6 9" stroke="#FFFFFF" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"></path></svg>
      <span style="font-size: 17px; font-weight: 650; letter-spacing: -0.015em;">Essay outline</span>
    </div>
    <div class="dl-glass" style="height: 104px; border-radius: 26px; padding: 14px 16px; display: flex; flex-direction: column; justify-content: space-between; background: radial-gradient(90% 90% at 100% 0%, rgba(255, 200, 150, 0.55) 0%, rgba(255, 255, 255, 0.56) 60%);">
      <svg width="26" height="26" viewBox="0 0 24 24" fill="none" aria-hidden="true"><circle cx="12" cy="12" r="12" fill="#1D2433"></circle><path d="M7.4 12.2 L 10.6 15.2 L 16.6 9" stroke="#FFFFFF" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"></path></svg>
      <span style="font-size: 17px; font-weight: 650; letter-spacing: -0.015em;">Source review</span>
    </div>
  </div>

  <section class="dl-glass" style="position: absolute; left: 16px; right: 16px; top: 312px; padding: 14px 16px 10px; display: flex; flex-direction: column; gap: 12px;">
    <div style="display: flex; align-items: flex-end; justify-content: space-between; padding: 0 2px;">
      <p style="display: flex; flex-direction: column;"><span class="dl-label">Sessions logged</span><span style="display: flex; align-items: baseline; gap: 6px;"><span class="dl-stat" style="font-size: 34px; line-height: 40px;">56</span><span class="dl-cap">all time</span></span></p>
      <p style="display: flex; flex-direction: column; align-items: flex-end; gap: 2px; padding-bottom: 4px;">
        <span class="dl-cap"><b style="color: #1D2433; font-size: 15px;">8</b> last 7 days</span>
        <span class="dl-cap"><b style="color: #3B4457; font-size: 15px;">6</b> previous 7 days</span>
      </p>
    </div>
    <div style="height: 1px; background: rgba(29, 36, 51, 0.08);"></div>
    <div class="dl-seg" role="group" aria-label="Chart range" style="grid-template-columns: repeat(2, minmax(0, 1fr));">
      <button type="button" aria-pressed="true" style="height: 32px;">7 days</button>
      <button type="button" aria-pressed="false" style="height: 32px;">All time</button>
    </div>
    <div style="display: flex; align-items: baseline; justify-content: space-between;">
      <p style="font-size: 16px; font-weight: 650;">Daily sessions</p>
      <p class="dl-cap">Sessions per day</p>
    </div>
    <svg width="326" height="124" viewBox="0 0 326 124" fill="none" role="img" aria-label="Daily sessions, Monday to Sunday: 2, 0, 1, 2, 1, 0, 2">
      <path d="M24 24 H 322 M 24 64 H 322" stroke="rgba(29,36,51,0.08)" stroke-width="1"></path>
      <path d="M24 104 H 322" stroke="rgba(29,36,51,0.2)" stroke-width="1"></path>
      <text class="dl-axis" x="2" y="28">2</text>
      <text class="dl-axis" x="2" y="68">1</text>
      <text class="dl-axis" x="2" y="108">0</text>
      <path d="M38.29 104.00 L38.29 31.00 A7.00 7.00 0 0 1 52.29 31.00 L52.29 104.00 Z" fill="#1D2433"></path>
      <circle cx="87.86" cy="104" r="3" fill="rgba(29,36,51,0.3)"></circle>
      <path d="M123.43 104.00 L123.43 71.00 A7.00 7.00 0 0 1 137.43 71.00 L137.43 104.00 Z" fill="#1D2433"></path>
      <path d="M166.00 104.00 L166.00 31.00 A7.00 7.00 0 0 1 180.00 31.00 L180.00 104.00 Z" fill="#1D2433"></path>
      <path d="M208.57 104.00 L208.57 71.00 A7.00 7.00 0 0 1 222.57 71.00 L222.57 104.00 Z" fill="#1D2433"></path>
      <circle cx="258.14" cy="104" r="3" fill="rgba(29,36,51,0.3)"></circle>
      <path d="M293.71 104.00 L293.71 31.00 A7.00 7.00 0 0 1 307.71 31.00 L307.71 104.00 Z" fill="#1D2433"></path>
      <text class="dl-axis" x="45.29" y="121" text-anchor="middle">Mon</text>
      <text class="dl-axis" x="87.86" y="121" text-anchor="middle">Tue</text>
      <text class="dl-axis" x="130.43" y="121" text-anchor="middle">Wed</text>
      <text class="dl-axis" x="173" y="121" text-anchor="middle">Thu</text>
      <text class="dl-axis" x="215.57" y="121" text-anchor="middle">Fri</text>
      <text class="dl-axis" x="258.14" y="121" text-anchor="middle">Sat</text>
      <text class="dl-axis" x="300.71" y="121" text-anchor="middle" style="fill: #1D2433; font-weight: 700;">Sun</text>
    </svg>
  </section>

  <section class="dl-glass" style="position: absolute; left: 16px; right: 16px; top: 682px; height: 130px; padding: 14px 18px; border-radius: 26px;">
    <p class="dl-label">Evening reading</p>
    <p class="dl-action-sm" style="margin-top: 6px;">3 days recorded as done</p>
  </section>

  <nav class="dl-tabbar" aria-label="Main">
    <button type="button" class="dl-tab">
      <svg width="24" height="22" viewBox="0 0 24 22" fill="none" aria-hidden="true"><path d="M2 17 A 10 8 0 0 1 22 17" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"></path><path d="M1 17 H 23" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"></path><circle cx="8" cy="11.2" r="2.4" fill="currentColor"></circle></svg>
      Today
    </button>
    <button type="button" class="dl-tab">
      <svg width="22" height="22" viewBox="0 0 22 22" fill="none" aria-hidden="true"><rect x="2.5" y="3" width="17" height="6" rx="3" stroke="currentColor" stroke-width="1.7"></rect><rect x="2.5" y="12.5" width="17" height="6" rx="3" stroke="currentColor" stroke-width="1.7"></rect></svg>
      Plans
    </button>
    <button type="button" class="dl-tab" aria-current="page">
      <svg width="22" height="22" viewBox="0 0 22 22" fill="none" aria-hidden="true"><path d="M3 18 V 13 M 8 18 V 9 M 13 18 V 11 M 18 18 V 5" stroke="currentColor" stroke-width="2" stroke-linecap="round"></path><circle cx="18" cy="5" r="2.2" fill="#F29A4A"></circle></svg>
      Progress
    </button>
  </nav>
  <button type="button" class="dl-fab" aria-label="Add a task">
    <svg width="20" height="20" viewBox="0 0 20 20" fill="none" aria-hidden="true"><path d="M10 3.5 V 16.5 M 3.5 10 H 16.5" stroke="#1D2433" stroke-width="2" stroke-linecap="round"></path></svg>
  </button>
</div>
</x-dc>
