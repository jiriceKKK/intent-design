<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":940,"height":1120}}'>
class Component extends DCLogic {
  renderVals() {
    const C = ['thread', 'threshold', 'margin', 'daylight', 'daylightdark', 'cairn'];
    const NAMES = { thread: 'Thread', threshold: 'Threshold', margin: 'Margin', daylight: 'Daylight', daylightdark: 'Daylight dark', cairn: 'Cairn' };
    const SCREENS = ['1 Today', '2 Set up', '3 Plans', '4 Session', '5 Session end', '6 Progress', '6 Progress · All time'];
    const s = this.state.screen ?? 0;
    const a = this.state.a ?? 'thread';
    const b = this.state.b ?? 'threshold';
    const flags = (side) => {
      const o = {};
      C.forEach((c) => { for (let i = 0; i < 7; i++) o[c + '_' + i] = side === c && s === i; });
      return o;
    };
    return {
      screens: SCREENS.map((label, i) => ({ label, pressed: s === i ? 'true' : 'false', pick: () => this.setState({ screen: i }) })),
      left: C.map((c) => ({ label: NAMES[c], pressed: a === c ? 'true' : 'false', pick: () => this.setState({ a: c }) })),
      right: C.map((c) => ({ label: NAMES[c], pressed: b === c ? 'true' : 'false', pick: () => this.setState({ b: c }) })),
      L: flags(a),
      R: flags(b),
      sName: SCREENS[s],
    };
  }
}
</script>
