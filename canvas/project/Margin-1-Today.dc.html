<div class="c-margin">

      <p class="mg-time">16:30</p>
      <p class="mg-note">25 min</p>
    </div>
    <div style="display: flex; flex-direction: column; gap: 6px;">
      <p class="mg-project">Essay outline</p>

  <hr class="mg-rule" style="position: absolute; left: 20px; right: 20px; top: 436px; margin: 0;">

  <article class="mg-row" style="position: absolute; left: 20px; right: 20px; top: 458px;">
    <div style="display: flex; flex-direction: column; gap: 6px; padding-top: 3px;">
      <svg width="18" height="18" viewBox="0 0 18 18" fill="none" aria-hidden="true"><path d="M14.6 9 A 5.6 5.6 0 1 1 12.4 4.6" stroke="#1B1D23" stroke-width="1.4" stroke-linecap="round"></path><path d="M10.2 3.6 L 12.8 4.2 L 12.2 6.8" stroke="#1B1D23" stroke-width="1.4" stroke-linecap="round" stroke-linejoin="round"></path></svg>
      <p class="mg-note mg-note-ink">After dinner</p>
    </div>
    <div style="display: flex; flex-direction: column; gap: 4px;">
      <p class="mg-project">Evening reading <span style="font-style: normal; font-family: 'IBM Plex Mono', monospace; font-size: 11.5px; letter-spacing: 0.06em; text-transform: uppercase; color: #666973; margin-left: 4px;">Routine</span></p>
      <h2 class="mg-head-sm">Read one page.</h2>
      <div style="display: flex; align-items: center; gap: 16px; margin-top: 10px;">
        <button type="button" class="mg-btn mg-btn-line" style="height: 44px; padding: 0 18px; font-size: 17px;">Start</button>
        <span class="mg-note">5 min</span>
      </div>
    </div>
  </article>

  <hr class="mg-rule" style="position: absolute; left: 20px; right: 20px; top: 616px; margin: 0;">

  <div class="mg-row" style="position: absolute; left: 20px; right: 20px; top: 628px;">
    <span></span>

    </button>
  </div>

  <nav class="mg-nav" aria-label="Main">
    <button type="button" class="mg-tab" aria-current="page">Today</button>
    <button type="button" class="mg-tab">Plans</button>
    <button type="button" class="mg-tab">Progress</button>
  </nav>
</div>
