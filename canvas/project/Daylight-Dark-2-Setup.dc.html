<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Daylight dark · Set up a task</title>
<script src="./support.js"></script>
<link rel="stylesheet" href="daylight.css">
<link rel="stylesheet" href="daylight-dark.css">
</head>
<body>
<x-dc>
<helmet>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Geist:wght@200..800&amp;display=swap">
<style>body{margin:0}</style>
</helmet>
<div class="c-daylight dl-dark">
  <div style="position: absolute; inset: 0; background: rgba(2, 4, 12, 0.4);"></div>
  <div style="position: absolute; left: 18px; right: 18px; top: 50px; height: 40px; border-radius: 26px 26px 0 0; background: rgba(255, 255, 255, 0.08);"></div>

  <section style="position: absolute; left: 0; right: 0; top: 62px; bottom: 0; border-radius: 34px 34px 0 0; background: rgba(21, 25, 46, 0.95); -webkit-backdrop-filter: blur(30px); backdrop-filter: blur(30px); box-shadow: inset 0 1px 0 rgba(255, 255, 255, 0.1), 0 -10px 30px -10px rgba(0, 0, 0, 0.5);">
    <span style="position: absolute; left: 50%; top: 8px; width: 36px; height: 5px; margin-left: -18px; border-radius: 3px; background: rgba(255, 255, 255, 0.24);"></span>
    <header style="position: absolute; left: 0; right: 0; top: 20px; height: 44px; display: grid; grid-template-columns: 96px 1fr 96px; align-items: center; padding: 0 8px;">
      <button type="button" class="dl-btn dl-btn-text" style="justify-self: start; font-weight: 500; font-size: 17px; height: 44px;">Cancel</button>
      <p style="text-align: center; font-size: 17px; font-weight: 650;">New task</p>
      <span></span>
    </header>

    <div style="position: absolute; left: 16px; right: 16px; top: 76px; display: flex; flex-direction: column; gap: 12px;">
      <div class="dl-elev" style="border-radius: 22px; padding: 12px 16px 12px;">
        <label class="dl-label" for="dd-project" style="display: block;">Project</label>
        <input id="dd-project" value="Essay outline" readonly style="width: 100%; border: 0; outline: none; background: transparent; padding: 4px 0 0; font-size: 17px; font-weight: 550; color: #F2F4FA;">
      </div>

      <div class="dl-elev" style="border-radius: 22px; padding: 12px 16px 14px;">
        <div style="display: flex; justify-content: space-between;">
          <label class="dl-label" for="dd-step">First step</label>
          <span class="dl-cap">Small enough to start now</span>
        </div>
        <textarea id="dd-step" rows="2" readonly style="width: 100%; height: 60px; border: 0; outline: none; resize: none; background: transparent; padding: 6px 0 0; font-size: 22px; line-height: 27px; font-weight: 600; letter-spacing: -0.02em; color: #F2F4FA;">Open the document and write three bullet points.</textarea>
      </div>

      <div class="dl-elev" style="border-radius: 22px; padding: 12px 12px 6px;">
        <p class="dl-label" style="padding: 0 4px 10px;">When to start</p>
        <div class="dl-seg" role="group" aria-label="Start cue">
          <button type="button" aria-pressed="false">Now</button>
          <button type="button" aria-pressed="true">At a time</button>
          <button type="button" aria-pressed="false">After…</button>
        </div>
        <button type="button" class="dl-row" style="width: 100%; border: 0; background: transparent; padding: 0 6px 0 2px; min-height: 76px; margin-top: 6px; gap: 12px; color: #F2F4FA;">
          <svg width="60" height="60" viewBox="0 0 60 60" fill="none" aria-hidden="true">
            <defs>
              <linearGradient id="dd-mini-day" x1="7" y1="0" x2="53" y2="0" gradientUnits="userSpaceOnUse"><stop offset="0" stop-color="#E4EAFF"></stop><stop offset="1" stop-color="#A9A9F0"></stop></linearGradient>
              <linearGradient id="dd-mini-night" x1="0" y1="30" x2="0" y2="54" gradientUnits="userSpaceOnUse"><stop offset="0" stop-color="#9C9CF0" stop-opacity="0.7"></stop><stop offset="1" stop-color="#9C9CF0" stop-opacity="0.1"></stop></linearGradient>
            </defs>
            <path d="M8 30 A 22 22 0 1 0 52 30 Z" fill="rgba(142,142,232,0.14)"></path>
            <path d="M8 30 A 22 22 0 0 1 52 30" stroke="url(#dd-mini-day)" stroke-width="2.4" stroke-linecap="round"></path>
            <path d="M52 30 A 22 22 0 1 1 8 30" stroke="url(#dd-mini-night)" stroke-width="2" stroke-linecap="round"></path>
            <path d="M2 30 H 58" stroke="rgba(255,255,255,0.18)" stroke-width="1"></path>
            <circle cx="48.02" cy="17.38" r="4.6" fill="#F2F4FA" stroke="#1F2440" stroke-width="2"></circle>
          </svg>
          <span style="flex: 1; display: flex; flex-direction: column; text-align: left; gap: 1px;">
            <span style="font-size: 16px; font-weight: 550;">Today</span>
            <span class="dl-cap">Late afternoon, before sunset</span>
          </span>
          <span style="font-size: 17px; font-weight: 650; font-variant-numeric: tabular-nums;">16:30</span>
          <svg width="8" height="14" viewBox="0 0 8 14" fill="none" aria-hidden="true"><path d="M1.5 1.5 L 6.5 7 L 1.5 12.5" stroke="#7E86A3" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"></path></svg>
        </button>
      </div>

      <div class="dl-group dl-elev">
        <div class="dl-row">
          <span style="flex: 1; display: flex; flex-direction: column;"><span style="font-size: 16px; font-weight: 550;">Reminder</span><span class="dl-cap">Optional</span></span>
          <button type="button" class="dl-switch" role="switch" aria-checked="false" aria-label="Reminder"></button>
        </div>
        <button type="button" class="dl-row" style="width: 100%; border: 0; background: transparent; text-align: left; color: #F2F4FA;">
          <span style="flex: 1; display: flex; flex-direction: column;"><span style="font-size: 15px; font-weight: 550; color: #C9CEDF;">Session</span><span class="dl-cap">25 min · Countdown · 3 apps blocked</span></span>
          <svg width="8" height="14" viewBox="0 0 8 14" fill="none" aria-hidden="true"><path d="M1.5 1.5 L 6.5 7 L 1.5 12.5" stroke="#7E86A3" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"></path></svg>
        </button>
      </div>
    </div>

    <div style="position: absolute; left: 16px; right: 16px; top: 690px; display: grid; grid-template-columns: 112px 1fr; gap: 10px;">
      <button type="button" class="dl-btn dl-btn-glass" style="height: 54px; border-radius: 27px;">Save</button>
      <button type="button" class="dl-btn dl-btn-ink" style="height: 54px; border-radius: 27px;">
        <svg width="16" height="16" viewBox="0 0 18 18" fill="none" aria-hidden="true"><path d="M5.5 3.6 C 5.5 2.9, 6.3 2.5, 6.9 2.9 L 14.2 7.9 C 14.8 8.3, 14.8 9.2, 14.2 9.6 L 6.9 14.6 C 6.3 15, 5.5 14.6, 5.5 13.9 Z" fill="#12162C"></path></svg>
        Save &amp; start
      </button>
    </div>
  </section>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":390,"height":844}}'>
class Component extends DCLogic {
  renderVals() { return {}; }
}
</script>
</body>
</html>
