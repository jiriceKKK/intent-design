<!doctype html>

</head>
<body>
<x-dc>

<style>body{margin:0}</style>
</helmet>
<div class="c-cairn">

  </div>

        <linearGradient id="cn-p2" x1="0" y1="0" x2="0.4" y2="1"><stop offset="0" stop-color="#7E9583"></stop><stop offset="1" stop-color="#4F6656"></stop></linearGradient>
      </defs>
      <ellipse cx="48" cy="86" rx="40" ry="3.5" fill="rgba(38,49,43,0.12)"></ellipse>

    </svg>
    <div style="display: flex; flex-direction: column; gap: 6px;">
      <p class="cn-label" style="font-weight: 700;">Finished</p>
      <p class="cn-big">2 tasks finished</p>
      <ul style="display: flex; flex-direction: column; gap: 4px; margin-top: 2px;">
        <li style="display: flex; align-items: center; gap: 8px; font-size: 16px; font-weight: 700; min-height: 26px;">

          <svg width="18" height="17" viewBox="0 0 12 11" fill="none" aria-hidden="true"><path d="M6.2 0.8 C 9.6 0.6, 11.4 3, 11.2 5.8 C 11 8.8, 8.6 10.4, 5.6 10.2 C 2.4 10, 0.6 8, 0.8 5.2 C 1 2.4, 3.2 1, 6.2 0.8 Z" fill="#4F6656"></path><path d="M3.6 5.6 L 5.2 7.2 L 8.4 3.8" stroke="#FBFAF7" stroke-width="1.2" stroke-linecap="round" stroke-linejoin="round"></path></svg>
          Source review
        </li>
      </ul>
    </div>
  </section>

  <section style="position: absolute; left: 16px; right: 16px; top: 334px; display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 10px;">
    <p style="display: flex; flex-direction: column; align-items: center; justify-content: center; height: 86px; border-radius: 38px 44px 40px 34px / 40px 36px 44px 38px; background: rgba(255, 255, 255, 0.55); box-shadow: inset 0 0 0 1px rgba(38, 49, 43, 0.07);"><span class="cn-stat">56</span><span class="cn-cap">all time</span></p>
    <p style="display: flex; flex-direction: column; align-items: center; justify-content: center; height: 86px; border-radius: 42px 36px 44px 40px / 36px 44px 38px 42px; background: rgba(255, 255, 255, 0.55); box-shadow: inset 0 0 0 1px rgba(38, 49, 43, 0.07);"><span class="cn-stat">8</span><span class="cn-cap">last 7 days</span></p>
    <p style="display: flex; flex-direction: column; align-items: center; justify-content: center; height: 86px; border-radius: 36px 42px 38px 44px / 42px 38px 44px 36px; background: rgba(255, 255, 255, 0.55); box-shadow: inset 0 0 0 1px rgba(38, 49, 43, 0.07);"><span class="cn-stat" style="color: #46524B;">6</span><span class="cn-cap">previous 7 days</span></p>
  </section>
  <p class="cn-label" style="position: absolute; left: 26px; top: 310px; font-weight: 700;">Sessions logged</p>

  <section class="cn-stone" style="position: absolute; left: 16px; right: 16px; top: 436px; padding: 14px 18px 10px; border-radius: 40px 46px 42px 36px / 38px 40px 46px 40px; display: flex; flex-direction: column; gap: 10px;">
    <div class="cn-seg" role="group" aria-label="Chart range" style="grid-template-columns: repeat(2, minmax(0, 1fr));">
      <button type="button" aria-pressed="true" style="height: 38px; font-size: 14px;">7 days</button>
      <button type="button" aria-pressed="false" style="height: 38px; font-size: 14px;">All time</button>
    </div>
    <div style="display: flex; align-items: baseline; justify-content: space-between;">
      <p style="font-size: 16px; font-weight: 700;">Daily sessions</p>
      <p class="cn-cap">Sessions per day</p>
    </div>
    <svg width="322" height="124" viewBox="0 0 322 124" fill="none" role="img" aria-label="Daily sessions, Monday to Sunday: 2, 0, 1, 2, 1, 0, 2">

      <path d="M24 104 H 318" stroke="rgba(38,49,43,0.22)" stroke-width="1"></path>

      <text class="cn-axis" x="2" y="68">1</text>
      <text class="cn-axis" x="2" y="108">0</text>

      <ellipse cx="87" cy="101" rx="5" ry="3.6" fill="none" stroke="#8E978F" stroke-width="1.3"></ellipse>
      <path d="M121.00 104.00 L121.00 72.00 A8.00 8.00 0 0 1 137.00 72.00 L137.00 104.00 Z" fill="#4F6656"></path>
      <path d="M163.00 104.00 L163.00 32.00 A8.00 8.00 0 0 1 179.00 32.00 L179.00 104.00 Z" fill="#4F6656"></path>
      <path d="M205.00 104.00 L205.00 72.00 A8.00 8.00 0 0 1 221.00 72.00 L221.00 104.00 Z" fill="#4F6656"></path>
      <ellipse cx="255" cy="101" rx="5" ry="3.6" fill="none" stroke="#8E978F" stroke-width="1.3"></ellipse>
      <path d="M289.00 104.00 L289.00 32.00 A8.00 8.00 0 0 1 305.00 32.00 L305.00 104.00 Z" fill="#4F6656"></path>
      <text class="cn-axis" x="45" y="121" text-anchor="middle">Mon</text>
      <text class="cn-axis" x="87" y="121" text-anchor="middle">Tue</text>
      <text class="cn-axis" x="129" y="121" text-anchor="middle">Wed</text>
      <text class="cn-axis" x="171" y="121" text-anchor="middle">Thu</text>
      <text class="cn-axis" x="213" y="121" text-anchor="middle">Fri</text>
      <text class="cn-axis" x="255" y="121" text-anchor="middle">Sat</text>
      <text class="cn-axis" x="297" y="121" text-anchor="middle" style="fill: #26312B; font-weight: 700;">Sun</text>
    </svg>
  </section>

  <section class="cn-stone-sage" style="position: absolute; left: 16px; right: 16px; top: 722px; height: 110px; padding: 14px 18px; border-radius: 36px 42px 34px 40px;">
    <p class="cn-label" style="color: #4F6656; font-weight: 700;">Evening reading · routine</p>
  </section>

  <nav class="cn-tabbar" aria-label="Main">
    <button type="button" class="cn-tab">
      <svg width="24" height="22" viewBox="0 0 24 22" fill="none" aria-hidden="true"><path d="M12.4 9.2 C 18.8 8.8 22.4 12 22 15.6 C 21.6 19.2 17.6 20.8 12 20.6 C 6.2 20.4 2.2 18.6 2.4 15 C 2.6 11.4 6.6 9.6 12.4 9.2 Z" stroke="currentColor" stroke-width="1.8"></path><path d="M12.6 1.8 C 15.6 1.6 17.2 3.2 17 5 C 16.8 6.8 15 7.6 12.6 7.6 C 10 7.6 8.6 6.6 8.8 4.8 C 9 3 10.2 2 12.6 1.8 Z" stroke="currentColor" stroke-width="1.5"></path></svg>
      Today

    <button type="button" class="cn-tab">
      <svg width="24" height="22" viewBox="0 0 24 22" fill="none" aria-hidden="true"><path d="M3 6 C 3 4.4 4.4 3.4 6.4 3.4 H 18 C 20 3.4 21 4.6 21 6 C 21 7.6 19.8 8.6 18 8.6 H 6.2 C 4.2 8.6 3 7.6 3 6 Z M 3 15.6 C 3 14 4.4 13 6.4 13 H 18 C 20 13 21 14.2 21 15.6 C 21 17.2 19.8 18.2 18 18.2 H 6.2 C 4.2 18.2 3 17.2 3 15.6 Z" stroke="currentColor" stroke-width="1.7"></path></svg>
