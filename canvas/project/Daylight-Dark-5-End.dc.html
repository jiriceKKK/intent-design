<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Daylight dark · Session end</title>
<script src="./support.js"></script>
<link rel="stylesheet" href="daylight.css">
<link rel="stylesheet" href="daylight-dark.css">
</head>
<body>
<x-dc>
<helmet>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Geist:wght@200..800&amp;display=swap">
<style>body{margin:0}</style>
</helmet>
<div class="c-daylight dl-dark" style="background: var(--stars), linear-gradient(180deg, #090D1E 0px, #10163A 110px, #1E1F48 200px, #33284E 262px, #33284E 100%);">
  <div aria-hidden="true" style="position: absolute; left: 0; right: 0; top: 150px; height: 170px; background: radial-gradient(70% 50% at 50% 66%, rgba(255, 190, 150, 0.18) 0%, rgba(255, 190, 150, 0.06) 55%, rgba(255, 190, 150, 0) 100%);"></div>
  <img src="moon-low.png" alt="" width="400" height="400" style="position: absolute; left: -5px; top: 40px; width: 400px; height: 400px; pointer-events: none;">

  <div style="position: absolute; left: 24px; right: 24px; top: 92px; display: flex; flex-direction: column; align-items: center; gap: 6px; text-align: center; color: #FFFFFF;">
    <h1 class="dl-title" style="font-size: 32px; line-height: 38px;">Session complete.</h1>
    <p style="font-size: 15px; font-weight: 500; color: #C9CEDF;">25 min · Essay outline</p>
  </div>

  <section style="position: absolute; left: 0; right: 0; top: 262px; bottom: 0; border-radius: 34px 34px 0 0; background: rgba(20, 24, 44, 0.88); -webkit-backdrop-filter: blur(30px) saturate(140%); backdrop-filter: blur(30px) saturate(140%); box-shadow: inset 0 1px 0 rgba(255, 255, 255, 0.12), 0 -12px 40px -16px rgba(0, 0, 0, 0.5);">
    <p class="dl-section" style="position: absolute; left: 22px; top: 22px;">And the task?</p>
    <div role="radiogroup" aria-label="What about the task" class="dl-group dl-elev" style="position: absolute; left: 16px; right: 16px; top: 46px;">
      <button type="button" class="dl-row" role="radio" aria-checked="false" style="width: 100%; border: 0; background: transparent; text-align: left; min-height: 58px; color: #F2F4FA;">
        <span style="flex: 1; display: flex; flex-direction: column;"><span style="font-size: 16px; font-weight: 600;">Task finished</span><span class="dl-cap">Mark Essay outline done</span></span>
        <span style="width: 22px; height: 22px; border-radius: 11px; box-shadow: inset 0 0 0 1.5px rgba(255, 255, 255, 0.3);"></span>
      </button>
      <button type="button" class="dl-row" role="radio" aria-checked="false" style="width: 100%; border: 0; background: transparent; text-align: left; min-height: 58px; color: #F2F4FA;">
        <span style="flex: 1; display: flex; flex-direction: column;"><span style="font-size: 16px; font-weight: 600;">Continue now</span><span class="dl-cap">Start another session</span></span>
        <span style="width: 22px; height: 22px; border-radius: 11px; box-shadow: inset 0 0 0 1.5px rgba(255, 255, 255, 0.3);"></span>
      </button>
      <button type="button" class="dl-row" role="radio" aria-checked="true" style="width: 100%; border: 0; background: rgba(201, 212, 255, 0.1); text-align: left; min-height: 58px; color: #F2F4FA;">
        <span style="flex: 1; display: flex; flex-direction: column;"><span style="font-size: 16px; font-weight: 650;">Done for today</span><span class="dl-cap">The task stays open</span></span>
        <svg width="22" height="22" viewBox="0 0 22 22" fill="none" aria-hidden="true"><circle cx="11" cy="11" r="11" fill="#F2F4FA"></circle><path d="M6.6 11.2 L 9.6 14.2 L 15.4 8.2" stroke="#12162C" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"></path></svg>
      </button>
    </div>

    <div class="dl-elev" style="position: absolute; left: 16px; right: 16px; top: 244px; border-radius: 22px; padding: 12px 16px 14px;">
      <div style="display: flex; justify-content: space-between;">
        <label class="dl-label" for="dd-next" style="color: #F2F4FA; font-weight: 600;">Next time, start with:</label>
        <span class="dl-cap">Optional</span>
      </div>
      <input id="dd-next" value="Write the opening paragraph." readonly style="width: 100%; border: 0; outline: none; background: transparent; padding: 8px 0 2px; font-size: 18px; font-weight: 550; color: #F2F4FA;">
    </div>
    <p class="dl-cap" style="position: absolute; left: 22px; right: 22px; top: 330px;">It will be on Today, placed after your cue.</p>

    <div style="position: absolute; left: 16px; right: 16px; top: 490px; display: grid; grid-template-columns: 112px 1fr; gap: 10px;">
      <button type="button" class="dl-btn dl-btn-glass" style="height: 54px; border-radius: 27px;">Skip</button>
      <button type="button" class="dl-btn dl-btn-ink" style="height: 54px; border-radius: 27px;">Save and return</button>
    </div>
  </section>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":390,"height":844}}'>
class Component extends DCLogic {
  renderVals() { return {}; }
}
</script>
</body>
</html>
