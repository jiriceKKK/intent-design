<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Thread · Set up a task</title>
<script src="./support.js"></script>
<link rel="stylesheet" href="thread.css">
</head>
<body>
<x-dc>
<helmet>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Figtree:wght@400..800&amp;display=swap">
<style>body{margin:0}</style>
</helmet>
<div class="c-thread">
  <header style="position: absolute; left: 0; right: 0; top: 54px; height: 44px; display: grid; grid-template-columns: 96px 1fr 96px; align-items: center; padding: 0 8px;">
    <button type="button" class="th-btn th-btn-text" style="justify-self: start; font-weight: 550; font-size: 17px;">Cancel</button>
    <p style="text-align: center; font-size: 17px; font-weight: 700; color: #23275A;">New task</p>
    <span></span>
  </header>

  <svg width="390" height="844" viewBox="0 0 390 844" fill="none" aria-hidden="true" style="position: absolute; left: 0; top: 0; pointer-events: none;">
    <path d="M28 162 L 28 400" stroke="#3B4096" stroke-width="2.25" stroke-linecap="round"></path>
    <path d="M28 412 L 28 452" stroke="#3B4096" stroke-width="2.25" stroke-linecap="round" stroke-dasharray="0.1 6"></path>
    <circle cx="28" cy="162" r="5" fill="#3B4096" stroke="#F6F1E7" stroke-width="3"></circle>
    <circle cx="28" cy="280" r="12" fill="#F8EACB"></circle>
    <circle cx="28" cy="280" r="7" fill="#E8B23F" stroke="#F6F1E7" stroke-width="3"></circle>
    <circle cx="28" cy="400" r="5" fill="#3B4096" stroke="#F6F1E7" stroke-width="3"></circle>
  </svg>

  <div style="position: absolute; left: 52px; width: 318px; top: 114px; display: flex; flex-direction: column; gap: 8px;">
    <label class="th-label" for="th-project">Project</label>
    <input id="th-project" class="th-field th-input" value="Essay outline" readonly>
  </div>

  <div style="position: absolute; left: 52px; width: 318px; top: 210px; display: flex; flex-direction: column; gap: 8px;">
    <label class="th-label th-label-ink" for="th-step" style="display: flex; justify-content: space-between;">First step <span style="font-weight: 600; color: #62637D;">Make it small</span></label>
    <textarea id="th-step" class="th-field th-textarea" rows="2" readonly style="height: 92px; box-shadow: inset 0 0 0 1.25px #E3DAC8, 0 14px 30px -20px rgba(35, 39, 90, 0.4);">Open the document and write three bullet points.</textarea>
  </div>

  <div style="position: absolute; left: 52px; width: 318px; top: 352px; display: flex; flex-direction: column; gap: 8px;">
    <p class="th-label">When to start</p>
    <div class="th-seg" role="group" aria-label="Start cue">
      <button type="button" aria-pressed="false">Now</button>
      <button type="button" aria-pressed="true">At a time</button>
      <button type="button" aria-pressed="false">After…</button>
    </div>
    <button type="button" class="th-row" style="border: 0; width: 100%; text-align: left;">
      <svg width="20" height="20" viewBox="0 0 20 20" fill="none" aria-hidden="true"><circle cx="10" cy="10" r="7.6" stroke="#2F3482" stroke-width="1.7"></circle><path d="M10 6 V 10.2 L 12.8 12" stroke="#2F3482" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"></path></svg>
      <span style="flex: 1; font-size: 16px; font-weight: 600; color: #23275A;">Today</span>
      <span style="font-size: 17px; font-weight: 700; color: #2F3482; font-variant-numeric: tabular-nums;">16:30</span>
      <svg width="8" height="14" viewBox="0 0 8 14" fill="none" aria-hidden="true"><path d="M1.5 1.5 L 6.5 7 L 1.5 12.5" stroke="#9C98B4" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"></path></svg>
    </button>
  </div>

  <div style="position: absolute; left: 52px; width: 318px; top: 524px; display: flex; flex-direction: column; gap: 10px;">
    <div class="th-row">
      <svg width="20" height="20" viewBox="0 0 20 20" fill="none" aria-hidden="true"><path d="M5 13.6 V 9 C 5 6.2, 7.2 4, 10 4 C 12.8 4, 15 6.2, 15 9 V 13.6 L 16.2 15 H 3.8 Z" stroke="#3F426B" stroke-width="1.6" stroke-linejoin="round"></path><path d="M8.2 17.2 C 8.6 17.9, 9.2 18.2, 10 18.2 C 10.8 18.2, 11.4 17.9, 11.8 17.2" stroke="#3F426B" stroke-width="1.6" stroke-linecap="round"></path></svg>
      <span style="flex: 1; display: flex; flex-direction: column;">
        <span style="font-size: 16px; font-weight: 600; color: #23275A;">Reminder</span>
        <span class="th-cap" style="font-weight: 500;">Optional</span>
      </span>
      <button type="button" class="th-switch" role="switch" aria-checked="false" aria-label="Reminder"></button>
    </div>
    <button type="button" style="display: flex; align-items: center; gap: 12px; min-height: 52px; padding: 0 16px; border: 0; border-radius: 18px; background: transparent; box-shadow: inset 0 0 0 1.25px #E3DAC8; text-align: left; width: 100%;">
      <svg width="20" height="20" viewBox="0 0 20 20" fill="none" aria-hidden="true"><circle cx="10" cy="11" r="6.6" stroke="#62637D" stroke-width="1.6"></circle><path d="M10 7.8 V 11 L 12 12.4 M 8 2.6 H 12" stroke="#62637D" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"></path></svg>
      <span style="flex: 1; display: flex; flex-direction: column;">
        <span style="font-size: 14px; font-weight: 600; color: #3F426B;">Session</span>
        <span class="th-cap" style="font-weight: 500;">25 min · Countdown · 3 apps blocked</span>
      </span>
      <svg width="8" height="14" viewBox="0 0 8 14" fill="none" aria-hidden="true"><path d="M1.5 1.5 L 6.5 7 L 1.5 12.5" stroke="#9C98B4" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"></path></svg>
    </button>
  </div>

  <div style="position: absolute; left: 20px; right: 20px; top: 752px; display: grid; grid-template-columns: 116px 1fr; gap: 10px;">
    <button type="button" class="th-btn th-btn-soft" style="height: 54px; border-radius: 27px; padding: 0 16px;">Save</button>
    <button type="button" class="th-btn th-btn-primary" style="height: 54px; border-radius: 27px;">
      <svg width="18" height="18" viewBox="0 0 18 18" fill="none" aria-hidden="true"><path d="M5.5 3.6 C 5.5 2.9, 6.3 2.5, 6.9 2.9 L 14.2 7.9 C 14.8 8.3, 14.8 9.2, 14.2 9.6 L 6.9 14.6 C 6.3 15, 5.5 14.6, 5.5 13.9 Z" fill="#FFFDF8"></path></svg>
      Save &amp; start
    </button>
  </div>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":390,"height":844}}'>
class Component extends DCLogic {
  renderVals() { return {}; }
}
</script>
</body>
</html>
