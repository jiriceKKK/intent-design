      <button type="button" role="radio" aria-checked="false" style="display: flex; align-items: flex-start; gap: 14px; border: 0; background: transparent; padding: 12px 0 12px; text-align: left; border-bottom: 1px solid #DCD8CF;">

      <button type="button" role="radio" aria-checked="true" style="display: flex; align-items: flex-start; gap: 14px; border: 0; background: transparent; padding: 12px 0 6px; text-align: left;">
